name: Build Docker Images

on:
  schedule:
    - cron: '0 2 * * 6'
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        php_version: ["8.5", "8.4", "8.3", "8.2"]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          # On PRs only this combination is built, as a test
          - php_version: "8.4"
            arch: amd64
            is_test_build: true

    env:
      RUNTIME_TAG: php${{ matrix.php_version }}-trixie-${{ matrix.arch }}
      DEV_TAG: php${{ matrix.php_version }}-trixie-dev-${{ matrix.arch }}

    steps:
      - name: Checkout code
        if: github.event_name != 'pull_request' || matrix.is_test_build == true
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request' || matrix.is_test_build == true
        uses: docker/setup-buildx-action@v3

      # Docker Hardened Images use Docker Hub credentials
      - name: Log in to Docker Hardened Images
        if: github.event_name != 'pull_request' || matrix.is_test_build == true
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract runtime metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ env.RUNTIME_TAG }}
            type=raw,value=${{ env.RUNTIME_TAG }}-{{sha}}

      - name: Extract dev metadata
        id: meta-dev
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ env.DEV_TAG }}
            type=raw,value=${{ env.DEV_TAG }}-{{sha}}

      # The dev build runs first; the runtime build reuses its cached layers.
      - name: Build and push dev image
        if: github.event_name != 'pull_request' || matrix.is_test_build == true
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dev
          platforms: ${{ matrix.platform }}
          build-args: |
            PHP_VERSION=${{ matrix.php_version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-dev.outputs.tags }}
          labels: ${{ steps.meta-dev.outputs.labels }}
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}

      - name: Build and push runtime image
        if: github.event_name != 'pull_request' || matrix.is_test_build == true
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: ${{ matrix.platform }}
          build-args: |
            PHP_VERSION=${{ matrix.php_version }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}

      - name: Smoke test runtime image
        if: github.event_name == 'pull_request' && matrix.is_test_build == true
        run: |
          image=ghcr.io/${{ github.repository }}:${{ env.RUNTIME_TAG }}
          docker run --rm "$image" php -i | grep -q 'Thread Safety => enabled'
          docker run --rm "$image" frankenphp version
          docker run -d --name smoke -e SERVER_NAME=:80 -p 8080:80 "$image"
          sleep 5
          curl -fsS http://localhost:8080/ | grep -q 'Thread Safety'
          docker rm -f smoke

  create-manifests:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        php_version: ["8.5", "8.4", "8.3", "8.2"]
        variant: ["", "-dev"]

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifests for PHP ${{ matrix.php_version }}${{ matrix.variant }}
        run: |
          image=ghcr.io/${{ github.repository }}
          base=php${{ matrix.php_version }}-trixie${{ matrix.variant }}
          docker buildx imagetools create \
            -t "$image:php${{ matrix.php_version }}${{ matrix.variant }}" \
            -t "$image:$base" \
            "$image:$base-amd64" \
            "$image:$base-arm64"
